{% extends 'base.html' %}

{% block title %}{{ title }} | Hayathul Islam Madrasa{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 600px; margin: 0 auto;">
    <form method="post">
        {% csrf_token %}
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label style="font-weight: 600; color: var(--text-main); font-size: 14px;">Structure Name</label>
                <input type="text" name="name" value="{{ structure.name }}" class="form-input" placeholder="e.g., Standard Monthly Subscription" required>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label style="font-weight: 600; color: var(--text-main); font-size: 14px;">Apply to Home Type</label>
                <select name="home_type" class="form-input" required>
                    <option value="member" {% if structure.home_type == 'member' %}selected{% endif %}>Member Household</option>
                    <option value="non_member" {% if structure.home_type == 'non_member' %}selected{% endif %}>Non-Member Household</option>
                </select>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label style="font-weight: 600; color: var(--text-main); font-size: 14px;">Amount (₹)</label>
                <input type="number" step="0.01" name="amount" value="{{ structure.amount }}" class="form-input" placeholder="0.00" required>
            </div>
        </div>

        <div style="margin-top: 32px; display: flex; gap: 15px;">
            <button type="submit" class="btn btn-primary" style="flex: 1; justify-content: center;">
                Save Fee Structure
            </button>
            <a href="{% url 'finance:fee_structure_list' %}" class="btn" style="flex: 1; justify-content: center; background: #eee; color: #333;">
                Cancel
            </a>
        </div>
    </form>
</div>

<style>
    .form-input {
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.1);
        background: rgba(255,255,255,0.5);
        font-size: 14px;
        width: 100%;
        box-sizing: border-box;
    }
    .form-input:focus {
        outline: none;
        border-color: var(--accent);
        background: white;
    }
</style>
{% endblock %}
